- name: Cache Bun dependencies
  uses: actions/cache@v4
  with:
      path: ~/.bun/install/cache
      key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
      restore-keys: |
          ${{ runner.os }}-bun-

- name: Setup Bun
  uses: oven-sh/setup-bun@v2
  with:
      bun-version: latest

- name: Install frontend dependencies
  run: bun install

- name: Setup MSYS2 with Clang ARM64 (gnullvm)
  if: runner.os == 'Windows' && (runner.arch == 'ARM64' || contains(matrix.runner, 'arm'))
  uses: msys2/setup-msys2@v2
  with:
      msystem: CLANGARM64
      path-type: inherit
      install: >-
          mingw-w64-clang-aarch64-toolchain

- name: Configure gnullvm Environment Variables
  if: runner.os == 'Windows' && (runner.arch == 'ARM64' || contains(matrix.runner, 'arm'))
  shell: pwsh
  run: |
      "CC_aarch64_pc_windows_gnullvm=C:\msys64\clangarm64\bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      "CXX_aarch64_pc_windows_gnullvm=C:\msys64\clangarm64\bin\clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      "AR_aarch64_pc_windows_gnullvm=C:\msys64\clangarm64\bin\llvm-ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=C:\msys64\clangarm64\bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

- name: Setup Rust cache
  uses: Swatinem/rust-cache@v2
  with:
      cache-all-crates: true
