- name: Cache Bun dependencies
  uses: actions/cache@v4
  with:
      path: ~/.bun/install/cache
      key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
      restore-keys: |
          ${{ runner.os }}-bun-

- name: Setup Bun
  uses: oven-sh/setup-bun@v2
  with:
      bun-version: latest

- name: Install frontend dependencies
  run: bun install

- name: Setup LLVM-MinGW Toolchain
  if: runner.os == 'Windows' && contains(join(matrix.targets, ','), 'aarch64')
  shell: bash
  run: |
      echo "Downloading x86_64 LLVM-MinGW cross-compiler..."
      curl -sSL --fail "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip" -o llvm-mingw.zip

      mkdir -p llvm_toolchain
      unzip -q llvm-mingw.zip -d llvm_toolchain

      TOOLCHAIN_ROOT=$(ls -d llvm_toolchain/llvm-mingw-*)

      BASE_DIR=$(pwd -W)
      ABS_TOOLCHAIN_PATH="$BASE_DIR/$TOOLCHAIN_ROOT"

      cp -r "$ABS_TOOLCHAIN_PATH/aarch64-w64-mingw32" "$ABS_TOOLCHAIN_PATH/aarch64-pc-windows-gnullvm"

      CC_PATH="$ABS_TOOLCHAIN_PATH/bin/aarch64-w64-mingw32-clang.exe"
      CXX_PATH="$ABS_TOOLCHAIN_PATH/bin/aarch64-w64-mingw32-clang++.exe"
      AR_PATH="$ABS_TOOLCHAIN_PATH/bin/llvm-ar.exe"

      echo "$ABS_TOOLCHAIN_PATH/bin" >> $GITHUB_PATH
      echo "CC_aarch64_pc_windows_gnullvm=$CC_PATH" >> $GITHUB_ENV
      echo "CXX_aarch64_pc_windows_gnullvm=$CXX_PATH" >> $GITHUB_ENV
      echo "AR_aarch64_pc_windows_gnullvm=$AR_PATH" >> $GITHUB_ENV
      echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$CC_PATH" >> $GITHUB_ENV

- name: Setup Rust cache
  uses: Swatinem/rust-cache@v2
  with:
      cache-all-crates: true
